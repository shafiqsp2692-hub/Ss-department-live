<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Department Live Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 480px;
    }
    
    /* Login Box Style */
    #login-box {
      background: #1e293b;
      padding: 25px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      text-align: center;
    }
    #login-box h2 {
      margin-top: 0;
      color: #38bdf8;
    }
    .input-field {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 16px;
      box-sizing: border-box;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    #error-msg {
      color: #ef4444;
      font-size: 14px;
      margin-top: 10px;
      display: none;
    }

    /* Dashboard Style */
    #dashboard {
      display: none;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      color: #38bdf8;
      font-size: 22px;
      margin: 0 0 5px 0;
    }
    .header p {
      color: #94a3b8;
      font-size: 13px;
      margin: 0;
    }
    .edit-sheet-btn {
      display: block;
      width: 100%;
      text-align: center;
      background: #059669;
      color: white;
      padding: 12px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .edit-sheet-btn:hover {
      background: #047857;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- LOGIN FORM -->
  <div id="login-box">
    <h2>Login Required</h2>
    <p style="color: #94a3b8; font-size: 14px;">Enter ID & Password to access dashboard</p>
    <input type="text" id="username" class="input-field" placeholder="User ID">
    <input type="password" id="password" class="input-field" placeholder="Password">
    <button class="btn" onclick="checkLogin()">Login</button>
    <p id="error-msg">Incorrect User ID or Password!</p>
  </div>

  <!-- DASHBOARD CONTENT -->
  <div id="dashboard">
    <div class="header">
      <h1>Department Staff Live Ranking</h1>
      <p>Automatic Ranking Based on Staff Count</p>
    </div>

    <!-- LINK TO GOOGLE SHEET FOR EDITING -->
    <a href="APNI_GOOGLE_SHEET_LINK_YAHAN_PASTE_KAREIN" target="_blank" class="edit-sheet-btn">
      ✏️ Open Google Sheet to Edit Data
    </a>

    <!-- Rankings Will Show Here -->
    <p style="text-align:center; color:#94a3b8;">Dashboard unlocked successfully!</p>
  </div>

</div>

<script>
  function checkLogin() {
    var user = document.getElementById("username").value;
    var pass = document.getElementById("password").value;

    // Yahan apna ID aur Password set karein:
    if (user === "admin" && pass === "12345") {
      document.getElementById("login-box").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
    } else {
      document.getElementById("error-msg").style.display = "block";
    }
  }
</script>

</body>
</html>
