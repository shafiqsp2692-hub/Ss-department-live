<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Department Staff Live Ranking</title>
    <meta property="og:title" content="Department Staff Live Ranking" />
  <meta property="og:description" content="Live ranking and staff stats update." />
  <meta property="og:type" content="website" />

  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 20px 10px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 500px;
    }

    /* LOGIN STYLES */
    #login-box {
      background: #161b22;
      padding: 25px 20px;
      border-radius: 12px;
      border: 1px solid #30363d;
      text-align: center;
      margin-top: 40px;
    }
    #login-box h2 {
      margin-top: 0;
      color: #58a6ff;
    }
    .input-field {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #fff;
      font-size: 16px;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: #238636;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn:hover { background: #2ea043; }
    #error-msg { color: #f85149; font-size: 14px; margin-top: 10px; display: none; }

    /* DASHBOARD STYLES */
    #dashboard { display: none; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { color: #58a6ff; font-size: 22px; margin: 0 0 5px 0; }
    .header p { color: #8b949e; font-size: 13px; margin: 0; }
    
    .edit-btn {
      display: none;
      width: 100%;
      text-align: center;
      background: #1f6feb;
      color: white;
      padding: 10px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      margin-bottom: 20px;
    }

    /* BOX / GRID STYLES (2 COLUMNS) */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .box-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 15px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }
    .box-card.top1 { border: 2px solid #f1e05a; background: #1c1a0e; }
    .box-card.top2 { border: 2px solid #a5d6ff; background: #0f1824; }
    .box-card.top3 { border: 2px solid #ffa657; background: #1f160e; }

    .rank-num {
      font-size: 13px;
      font-weight: bold;
      color: #8b949e;
      margin-bottom: 5px;
    }
    .branch-name {
      font-size: 15px;
      font-weight: 600;
      color: #f0f6fc;
      margin-bottom: 8px;
      word-break: break-word;
    }
    .count-badge {
      background: #1f6feb;
      color: #ffffff;
      font-weight: bold;
      font-size: 16px;
      padding: 4px 12px;
      border-radius: 15px;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- LOGIN BOX -->
  <div id="login-box">
    <h2>Login Required</h2>
    <p style="color: #8b949e; font-size: 14px;">Enter credentials to view live ranking</p>
    <input type="text" id="username" class="input-field" placeholder="User ID">
    <input type="password" id="password" class="input-field" placeholder="Password">
    <button class="btn" onclick="checkLogin()">Login</button>
    <p id="error-msg">Invalid User ID or Password!</p>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard">
    <div class="header">
      <h1>Department Staff Live Ranking</h1>
      <p>Automatic Ranking Based on Google Sheet</p>
    </div>

    <!-- EDIT LINK FOR ADMIN -->
    <a id="edit-link" href="https://docs.google.com/spreadsheets/d/1-7pjYbE3wIA836FOMOcFb10FdtGwQlnHU0y_-jDPIzM/edit" target="_blank" class="edit-btn">
      ✏️ Edit Data in Google Sheet
    </a>

    <!-- 2 COLUMN BOX GRID -->
    <div class="card-grid" id="ranking-list">
      <p style="text-align:center; grid-column: span 2;">Loading live data...</p>
    </div>
  </div>

</div>

<script>
  function checkLogin() {
    var user = document.getElementById("username").value.trim();
    var pass = document.getElementById("password").value.trim();

    if (user === "admin" && pass === "123") {
      document.getElementById("login-box").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
      document.getElementById("edit-link").style.display = "block";
      fetchSheetData();
    } 
    else if (user === "staff" && pass === "1234") {
      document.getElementById("login-box").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
      document.getElementById("edit-link").style.display = "none";
      fetchSheetData();
    } 
    else {
      document.getElementById("error-msg").style.display = "block";
    }
  }

  function fetchSheetData() {
    fetch("https://docs.google.com/spreadsheets/d/1-7pjYbE3wIA836FOMOcFb10FdtGwQlnHU0y_-jDPIzM/gviz/tq?tqx=out:csv")
      .then(response => response.text())
      .then(csvText => {
        const rows = csvText.split('\n').map(row => row.split(','));
        let branchesData = [];

        for (let i = 1; i < rows.length; i++) {
          if (rows[i].length >= 2) {
            let name = rows[i][0].replace(/"/g, '').trim();
            let count = parseInt(rows[i][1].replace(/"/g, '').trim()) || 0;
            if (name) {
              branchesData.push({ name, count });
            }
          }
        }

        branchesData.sort((a, b) => b.count - a.count);

        const listContainer = document.getElementById("ranking-list");
        listContainer.innerHTML = "";

        branchesData.forEach((item, index) => {
          let topClass = "";
          if (index === 0) topClass = "top1";
          else if (index === 1) topClass = "top2";
          else if (index === 2) topClass = "top3";

          const card = document.createElement("div");
          card.className = `box-card ${topClass}`;
          card.innerHTML = `
            <div class="rank-num">#${index + 1}</div>
            <div class="branch-name">${item.name}</div>
            <div class="count-badge">${item.count}</div>
          `;
          listContainer.appendChild(card);
        });
      })
      .catch(err => {
        console.error(err);
        document.getElementById("ranking-list").innerHTML = "<p style='text-align:center; color:red; grid-column: span 2;'>Failed to load Google Sheet data.</p>";
      });
  }
</script>

</body>
</html>
